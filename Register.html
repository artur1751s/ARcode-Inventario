<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="img/Logo ARcode.png"/>
  <title>ARcode - Sign up</title>
  <link rel="stylesheet" href="CSS/Auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <section class="card">
            <img src="img/Logo ARcode.png" alt="logo-ARcode">
            <h1>Arcode</h1>
            <h2>Crear Cuenta</h2>
            
            <form id="form-cliente" class="form-grid">
                <div class="form-group full">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ingrese su nombre completo">
                </div>
                
                <div class="form-group">
                    <label for="documento">Documento</label>
                    <input type="text" id="documento" placeholder="Ingrese su número de documento">
                </div>
                
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" placeholder="Ingrese su teléfono">
                </div>
                
                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" placeholder="Ingrese su dirección">
                </div>
                
                <div class="form-group">
                    <label for="emailCliente">Correo</label>
                    <input type="email" id="emailCliente" placeholder="Ingrese su correo electrónico">
                </div>
                
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="Login.html" class="btn btn-secondary">Volver</a>
                </div>
            </form>
        </section>
    </main>
    <script type="module" src="JS/Auth.js"></script>
</body>
</html>
