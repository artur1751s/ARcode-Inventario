<section class="section-header">
    <h1>Pedidos</h1>
    <button id="new-order">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
        Añadir Nuevo
    </button>
</section>

<section>
    <div class="search">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
        <input class="search-input" id="search-orders" type="text" placeholder="">
        <label for="search-orders">Buscar Pedidos</label>
    </div>

    <div class="table-container">
        <table>
            <caption>Listado de Pedidos</caption>
            <thead>
                <tr>
                    <th>ID PEDIDO</th>
                    <th>CLIENTE</th>
                    <th>FECHA</th>
                    <th>ESTADO</th>
                    <th>TOTAL</th>
                    <th>ACCION</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.id_pedido}"></td>
                    <td th:text="${pedido.id_cliente}"></td>
                    <td th:text="${pedido.fecha}"></td>
                    <td th:text="${pedido.estado_pedido}"></td>
                    <td>Funcion en progreso</td>
                    <td>
                        <div class="actions">
                            <button class="edit" aria-label="Editar Pedido"></button>
                            <form th:action="@{'/pedidos/delete/'+${pedido.id_pedido}}" method="post">
                                <button class="delete" aria-label="Eliminar Pedido"></button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
