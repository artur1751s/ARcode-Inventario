<h1>Clientes</h1>

<section>
    <div class="search">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
        <input class="search-input" id="search-clients" type="text" placeholder="">
        <label for="search-clients">Buscar Clientes</label>
    </div>

    <div class="table-container">
        <table id="table-clientes">
            <caption>Listado de clientes registrados</caption>
            <thead>
                <tr>
                    <th>ID CLIENTE</th>
                    <th>NOMBRE</tg>
                    <th>IDENTIFICACION</th>
                    <th>CORREO</th>
                    <th>TELEFONO</th>
                    <th>DIRECCION</th>
                    <th>ESTADO</th>
                    <th>ACCION</th>
                </tr>
            </thead>
            <tbody th:each="cliente : ${clientes}">
                <tr>
                    <td th:text="${cliente.id_cliente}"></td>
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.identificacion}"></td>
                    <td th:text="${cliente.correo}"></td>
                    <td th:text="${cliente.telefono}"></td>
                    <td th:text="${cliente.direccion}"></td>
                    <td>FUNCION EN PROGRESO 😅</td>
                    <td>
                        <div class="actions">
                            <button class="edit" aria-label="Editar Cliente"></button>
                            <form th:action="@{'/clientes/delete/'+${cliente.id_cliente}}" method="post">
                                <button class="user-disable" aria-label="Habilitar Cliente"></button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
