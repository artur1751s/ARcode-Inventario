<section class="section-header">
    <h1>Proveedores</h1>
    <button id="new-supplier">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
        Añadir Nuevo
    </button>
</section>

<section>
    <div class="search">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
        <input class="search-input" id="search-suppliers" type="text" placeholder="">
        <label>Buscar Proveedores</label>
    </div>

    <div class="table-container">
        <table>
            <caption>Listado de proveedores registrados</caption>
            <thead>
                <tr>
                    <th>ID PROVEEDOR</th>
                    <th>NOMBRE</th>
                    <th>EMPRESA</th>
                    <th>TELEFONO</th>
                    <th>ESTADO</th>
                    <th>ACCION</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="proveedor : ${proveedores}">
                    <td th:text="${proveedor.id_proveedor}"></td>
                    <td th:text="${proveedor.nombre}"></td>
                    <td th:text="${proveedor.empresa}"></td>
                    <td th:text="${proveedor.telefono}"></td>
                    <td th:text="${proveedor.estado}"></td>
                    <td>
                        <div class="actions">
                            <button class="edit" aria-label="Editar Proveedor"></button>
                            <form th:action="@{'/proveedor/delete/'+${proveedor.id_proveedor}}" method="post">
                                <button class="user-disable" aria-label="Deshabilitar Proveedor"></button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
