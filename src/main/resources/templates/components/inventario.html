<section class="section-header">
    <h1>Inventario</h1>
    <button id="new-product">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
        Añadir Nuevo
    </button>
</section>

<section>
    <div class="search">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
        <input class="search-input" id="search-products" type="text" placeholder="">
        <label for="search-products">Buscar Productos</label>
    </div>

    <div class="table-container">
        <table>
            <caption>Listado de productos registrados</caption>
            <thead>
                <tr>
                    <th>ID PRODUCTO</td>
                    <th>PRODUCTO</td>
                    <th>CATEGORIA</th>
                    <th>STOCK</th>
                    <th>PRECIO</th>
                    <th>VALOR TOTAL</th>
                    <th>ACCION</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id_producto}"></td>
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${producto.categoria}"></td>
                    <td th:text="${producto.stock}"></td>
                    <td th:text="${#numbers.formatDecimal(producto.precio, 0, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${#numbers.formatDecimal(producto.precio * producto.stock, 0, 'POINT', 2, 'COMMA')}"></td>
                    <td>
                        <div class="actions">
                            <button class="edit" aria-label="Editar Producto"></button>
                            <form th:action="@{'/productos/delete/'+${producto.id_producto}}" method="post">
                                <button class="delete" aria-label="Eliminar Producto"></button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
